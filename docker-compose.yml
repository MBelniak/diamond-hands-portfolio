services:
  redis:
    image: redis:8.8.4-alpine
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  app:
    build: .
    container_name: app-container
    ports:
      - "3000:3000"
    env_file: .env.docker.local
    environment:
      REDIS_URL: redis://redis:6379
    depends_on: 
      - redis
volumes:
  redis-data: